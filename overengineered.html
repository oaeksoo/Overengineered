<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overengineered</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe7ef;--fg:#0e1621;--hud:#142030;--hud2:#1d2e44;--line:#35506f;--acc:#4aa8ff;--warn:#ffd23f;--good:#4be08a;--bad:#ff6b6b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a111a;--fg:#e8f0fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a111a;--fg:#e8f0fa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:1180px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.logo{font:28px "Russo One",Impact,sans-serif;letter-spacing:1px}
.logo b{color:var(--acc);font-weight:400;text-decoration:underline wavy var(--warn) 2px;text-underline-offset:6px}
.tag{font-size:13px;opacity:.75;text-align:right}
#main{display:flex;gap:10px;align-items:stretch}
#pal{width:136px;flex:none;background:var(--hud);color:#e8f0fa;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
#pal h3{margin:0 0 2px;font:14px "Russo One",sans-serif;color:var(--acc)}
.tool,.btn{display:flex;align-items:center;gap:8px;background:var(--hud2);color:#e8f0fa;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.tool i{font-style:normal;width:20px;text-align:center;font-size:17px}
.tool.on{outline:2px solid var(--acc);background:#244466}
.tool:hover,.btn:hover{border-color:var(--acc)}
.tool:focus-visible,.btn:focus-visible{outline:2px solid var(--warn)}
#stage{position:relative;flex:1;min-width:0}
canvas{width:100%;height:auto;display:block;border-radius:8px;border:2px solid var(--line);touch-action:none;cursor:crosshair;background:#6aa6d6}
#goal{position:absolute;top:10px;left:10px;max-width:42%;background:rgba(20,32,48,.92);color:#e8f0fa;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px}
#goal b{color:var(--acc)}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,17,26,.6);border-radius:8px}
#msg[hidden]{display:none}
#box{background:var(--hud);color:#e8f0fa;border:2px solid var(--line);border-radius:10px;padding:20px 26px;text-align:center;max-width:90%}
#mt{font:34px "Russo One",Impact,sans-serif;margin:0 0 6px}
#md{margin:0 0 14px}
#box .btn{display:inline-flex;margin:0 4px;justify-content:center}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;background:var(--hud);color:#e8f0fa;border:1px solid var(--line);border-radius:8px;padding:8px}
#bar .btn.go{background:#1f6d43;border-color:var(--good)}
#hint{flex:1;min-width:180px;font-size:13px;opacity:.85}
#stat{font:13px "Russo One",sans-serif;color:var(--warn)}
#lvls{display:flex;gap:6px;align-items:center}
#lvls .btn.on{outline:2px solid var(--acc)}
#lname{font-size:13px;min-width:140px;text-align:right}
footer{margin-top:12px;text-align:center;font:18px "Russo One",Impact,sans-serif;letter-spacing:1px}
@media (max-width:720px){#main{flex-direction:column}#pal{width:auto;flex-direction:row;flex-wrap:wrap}#pal h3{width:100%}.tool{flex:1 1 30%}#goal{max-width:60%;font-size:11px}#lname{text-align:left}}
</style></head>
<body><div id="app">
<header>
  <div class="logo">&#9881; OVER<b>ENGINEERED</b></div>
  <div class="tag">Why solve it simply<br>when you can overengineer it?</div>
</header>
<div id="main">
  <div id="pal"><h3>Components</h3></div>
  <div id="stage">
    <canvas id="c" width="960" height="540"></canvas>
    <div id="goal"><b>Goal:</b> <span id="gt"></span></div>
    <div id="msg" hidden><div id="box"><h2 id="mt"></h2><p id="md"></p>
      <button class="btn go" id="again">Try again</button><button class="btn" id="next">Next level</button></div></div>
  </div>
</div>
<div id="bar">
  <button class="btn go" id="run" title="Space">&#9654; Run</button>
  <button class="btn" id="rst">&#8635; Reset</button>
  <button class="btn" id="clr">&#10005; Clear parts</button>
  <button class="btn" id="rot" title="R">Rotate</button>
  <button class="btn" id="flip" title="F">Flip</button>
  <span id="hint"></span><span id="stat"></span>
  <div id="lvls"></div><span id="lname"></span>
</div>
<footer>Build &rarr; Test &rarr; Fail &rarr; Improve</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const {Engine,Bodies,Body,Composite,Constraint,Events,Query}=Matter;
const W=960,H=540,G=20,R=12,STEP=Math.PI/12,TAU=Math.PI*2;
const cv=document.getElementById('c'),cx=cv.getContext('2d'),$=id=>document.getElementById(id);
const PT={ramp:{n:'Ramp',i:'\u2571',p:10,a:STEP},gear:{n:'Gear',i:'\u2699',p:50,a:0},lever:{n:'Lever',i:'\u2696',p:30,a:0},
  conveyor:{n:'Conveyor',i:'\u25AD',p:40,a:0},motor:{n:'Motor',i:'\u26A1',p:75,a:0},bucket:{n:'Bucket',i:'\u2294',p:20,a:0}};
const LV=[
 {n:'Level 1 - Hello World',t:'Get the ball into the bucket.',b:[70,158],ter:[[0,170,170,370],[0,480,960,60],[690,400,24,80]],g:[820,480]},
 {n:'Level 2 - Going Up',t:'The bucket is up high. Lift the ball.',b:[70,308],ter:[[0,320,170,220],[0,480,960,60],[760,180,200,360]],g:[870,180]},
 {n:'Level 3 - Test',t:'Squeeze the ball under the wall.',b:[70,118],ter:[[0,130,170,410],[0,480,960,60],[540,0,40,270],[330,430,630,110]],g:[880,430]}];
const FAILS=['Build, test, fail, improve. You are on step three.','More gears. The answer is always more gears.','Have you tried adding a motor?','Physics disagrees with your plan.','That ball had so much potential.'];
let lv=0,store=[[],[],[]],parts=store[0],tool=null,ang=0,mouse=null,mode='edit',eng,ball,objs=[],T=0,inGoal=0,still=0,acc=0,last=0;

// ---------- physics ----------
function cup(x,y,hw,h){const t=6,f=Bodies.rectangle;
  return Body.create({isStatic:true,friction:.3,parts:[f(x,y-t/2,hw*2,t),f(x-hw+t/2,y-h/2,t,h),f(x+hw-t/2,y-h/2,t,h)]})}
function pin(add,b,x,y){add(Constraint.create({pointA:{x,y},bodyB:b,pointB:{x:0,y:0},length:0,stiffness:1}))}
function build(){
  eng=Engine.create();const add=b=>Composite.add(eng.world,b),L=LV[lv],f=Bodies.rectangle;
  L.ter.forEach(([x,y,w,h])=>add(f(x+w/2,y+h/2,w,h,{isStatic:true,friction:.3})));
  add(cup(L.g[0],L.g[1],32,42));
  ball=Bodies.circle(L.b[0],L.b[1],R,{restitution:.3,friction:.03,frictionAir:.0005,density:.002});add(ball);
  objs=parts.map(p=>{const o={p,d:[Math.cos(p.a),Math.sin(p.a)]},ng={collisionFilter:{group:-1}};
    if(p.type==='ramp'){o.b=f(p.x,p.y,120,12,{isStatic:true,angle:p.a,friction:.05});add(o.b)}
    else if(p.type==='conveyor'){o.b=f(p.x,p.y,130,12,{isStatic:true,angle:p.a,friction:.6});add(o.b)}
    else if(p.type==='bucket'){o.b=cup(p.x,p.y,28,36);add(o.b)}
    else if(p.type==='gear'){const s={density:.02},pr=[0,1,2].map(k=>f(p.x,p.y,68,9,{...s,angle:k*Math.PI/3}));pr.push(Bodies.circle(p.x,p.y,10,s));
      o.b=Body.create({parts:pr,frictionAir:0,friction:.6});o.dir=Math.cos(p.a)>=0?1:-1;add(o.b);pin(add,o.b,p.x,p.y)}
    else if(p.type==='lever'){o.b=f(p.x,p.y,130,10,{angle:p.a,density:.004,frictionAir:.02,friction:.3});add(o.b);pin(add,o.b,p.x,p.y)}
    else if(p.type==='motor'){add(f(p.x-o.d[0]*4,p.y-o.d[1]*4,36,36,{isStatic:true,angle:p.a,...ng}));
      o.b=f(p.x+o.d[0]*31,p.y+o.d[1]*31,34,14,{angle:p.a,density:.03,frictionAir:0,...ng});add(o.b)}
    return o});
  Events.on(eng,'beforeUpdate',tick);T=0;inGoal=0;still=0;acc=0;
}
function tick(){T+=1/60;const g=eng.gravity;
  objs.forEach(o=>{const p=o.p,b=o.b;
    if(p.type==='gear')Body.setAngularVelocity(b,o.dir*.055);
    else if(p.type==='lever'){const r=b.angle-p.a;if(Math.abs(r)>.5){Body.setAngle(b,p.a+Math.sign(r)*.5);Body.setAngularVelocity(b,0)}}
    else if(p.type==='conveyor'){if(Query.collides(b,[ball]).length){const v=ball.velocity.x*o.d[0]+ball.velocity.y*o.d[1];
      if(v<3.2)Body.setVelocity(ball,{x:ball.velocity.x+o.d[0]*.3,y:ball.velocity.y+o.d[1]*.3})}}
    else if(p.type==='motor'){const ph=(T%1.4)/1.4,e=ph<.1?40*ph/.1:40*(1-(ph-.1)/.9);
      Body.setVelocity(b,{x:p.x+o.d[0]*(31+e)-b.position.x,y:p.y+o.d[1]*(31+e)-b.position.y});
      Body.setAngle(b,p.a);Body.setAngularVelocity(b,0);b.force.y-=b.mass*g.y*g.scale}
  })}
function check(){const [gx,gy]=LV[lv].g,x=ball.position.x,y=ball.position.y;
  if(Math.abs(x-gx)<26&&y>gy-36&&y<gy-8){if(++inGoal>25)return end(true)}else inGoal=0;
  still=ball.speed<.06?still+1:0;
  if(y>H+60||x<-60||x>W+60||T>40||still>150)end(false)}
const score=()=>parts.reduce((s,p)=>s+PT[p.type].p,0);
function end(win){mode=win?'won':'failed';$('msg').hidden=false;
  $('mt').textContent=win?'SUCCESS!':'FAILED';$('mt').style.color=win?'var(--good)':'var(--bad)';
  const n=parts.length;
  $('md').textContent=win?`Overengineering score: ${score()}. `+(n<=1?'A simple solution. Disgusting.':n<=4?'Respectable complexity.':'Magnificently unnecessary.'):FAILS[Math.random()*FAILS.length|0];
  $('next').hidden=!(win&&lv<LV.length-1)}

// ---------- state / ui ----------
function sync(){document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.k===tool));
  $('stat').textContent=`Parts ${parts.length} | Score ${score()}`;
  $('hint').textContent=tool?`Placing ${PT[tool].n}: click to place, R rotate, F flip, Esc to cancel.`:'No tool selected: click a part to remove it. Right-click also removes.';
  document.querySelectorAll('#lvls .btn').forEach((b,i)=>b.classList.toggle('on',i===lv))}
function load(i){lv=i;parts=store[i];$('gt').textContent=LV[i].t;$('lname').textContent=LV[i].n;reset()}
function reset(){mode='edit';$('msg').hidden=true;build();sync()}
function run(){if(mode!=='edit')reset();Body.setVelocity(ball,{x:1.8,y:0});mode='run'}
function pick(k){tool=tool===k?null:k;ang=tool?PT[tool].a:0;sync()}
Object.entries(PT).forEach(([k,v])=>{const b=document.createElement('button');b.className='tool';b.dataset.k=k;b.innerHTML=`<i>${v.i}</i>${v.n}`;b.onclick=()=>pick(k);$('pal').appendChild(b)});
LV.forEach((l,i)=>{const b=document.createElement('button');b.className='btn';b.textContent='L'+(i+1);b.onclick=()=>load(i);$('lvls').appendChild(b)});
$('run').onclick=run;$('rst').onclick=reset;$('again').onclick=reset;$('next').onclick=()=>load(lv+1);
$('clr').onclick=()=>{parts.length=0;reset()};
$('rot').onclick=()=>ang=(ang+STEP)%TAU;$('flip').onclick=()=>ang=(ang+Math.PI)%TAU;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
const snap=v=>Math.round(v/G)*G;
function remove(m){let bi=-1,bd=50;parts.forEach((p,i)=>{const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<bd){bd=d;bi=i}});if(bi>=0)parts.splice(bi,1)}
cv.onpointermove=e=>mouse=pos(e);cv.onpointerleave=()=>mouse=null;
cv.onpointerdown=e=>{if(e.button!==0)return;const m=mouse=pos(e);if(mode==='run')reset();if(mode!=='edit')return;
  if(tool)parts.push({type:tool,x:snap(m.x),y:snap(m.y),a:ang});else remove(m);build();sync()};
cv.oncontextmenu=e=>{e.preventDefault();if(mode==='run')reset();if(mode==='edit'){remove(pos(e));build();sync()}};
onkeydown=e=>{const k=e.key.toLowerCase();
  if(k==='r')ang=(ang+(e.shiftKey?-STEP:STEP)+TAU)%TAU;else if(k==='f')ang=(ang+Math.PI)%TAU;
  else if(k==='escape'){tool=null;sync()}else if(k===' '){e.preventDefault();run()}};

// ---------- drawing ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(()=>{const c=bg.getContext('2d'),g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3f7fbf');g.addColorStop(1,'#cfe7f2');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(60,90,120,.45)';c.beginPath();c.moveTo(0,420);[[150,300],[260,380],[420,250],[580,400],[740,290],[860,380],[960,320],[960,H],[0,H]].forEach(p=>c.lineTo(p[0],p[1]));c.fill();
  c.fillStyle='rgba(255,255,255,.8)';[[200,80,40],[620,60,50],[820,110,36]].forEach(([x,y,r])=>{c.beginPath();c.ellipse(x,y,r*1.6,r*.5,0,0,7);c.fill();c.beginPath();c.ellipse(x+r*.6,y-r*.25,r,r*.5,0,0,7);c.fill()})})();
function drawCup(x,y,hw,h,col){cx.fillStyle=col;cx.beginPath();cx.moveTo(x-hw-4,y-h);cx.lineTo(x+hw+4,y-h);cx.lineTo(x+hw,y);cx.lineTo(x-hw,y);cx.fill();
  cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(x-hw-6,y-h-3,hw*2+12,6);cx.strokeStyle='rgba(0,0,0,.35)';cx.lineWidth=2;cx.strokeRect(x-hw,y-h*.5,hw*2,1)}
function drawObj(o){const p=o.p,b=o.b;cx.save();
  const bp=b?b.position:(p.type==='motor'?{x:p.x+o.d[0]*31,y:p.y+o.d[1]*31}:p),ba=b?b.angle:p.a;
  if(p.type==='ramp'){cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle='#8996a8';cx.fillRect(-60,-6,120,12);
    for(let i=0;i<10;i++){cx.fillStyle=i%2?'#1e232b':'#e7b928';cx.fillRect(-60+i*12,-6,12,4)}}
  else if(p.type==='conveyor'){cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle='#2b3544';cx.fillRect(-65,-6,130,12);
    cx.beginPath();cx.rect(-65,-6,130,12);cx.clip();const off=(T*50)%16;cx.fillStyle='#e7b928';for(let x=-65+off;x<65;x+=16)cx.fillRect(x,-6,6,3);
    cx.fillStyle='#4b586b';[-60,60].forEach(x=>{cx.beginPath();cx.arc(x,0,7,0,7);cx.fill()})}
  else if(p.type==='bucket')drawCup(p.x,p.y,28,36,'#3aa0ff');
  else if(p.type==='gear'){cx.translate(bp.x,bp.y);cx.rotate(ba);cx.fillStyle='#8c9aae';for(let i=0;i<12;i++){cx.save();cx.rotate(i*Math.PI/6);cx.fillRect(28,-4,7,8);cx.restore()}
    cx.fillStyle='#4a5565';cx.strokeStyle='#a9b6c8';cx.lineWidth=3;cx.beginPath();cx.arc(0,0,30,0,7);cx.fill();cx.stroke();
    for(let k=0;k<3;k++){cx.save();cx.rotate(k*Math.PI/3);cx.fillStyle='#a9b6c8';cx.fillRect(-28,-2,56,4);cx.restore()}
    cx.fillStyle='#d3dbe6';cx.beginPath();cx.arc(0,0,8,0,7);cx.fill()}
  else if(p.type==='lever'){cx.fillStyle='#55657a';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-16,p.y+34);cx.lineTo(p.x+16,p.y+34);cx.fill();
    cx.translate(bp.x,bp.y);cx.rotate(ba);cx.fillStyle='#7a8798';cx.fillRect(-65,-5,130,10);cx.fillStyle='#e23b3b';cx.beginPath();cx.arc(-60,-9,6,0,7);cx.fill();
    cx.fillStyle='#d3dbe6';cx.beginPath();cx.arc(0,0,5,0,7);cx.fill()}
  else if(p.type==='motor'){cx.translate(p.x,p.y);cx.rotate(p.a);const d=Math.hypot(bp.x-p.x,bp.y-p.y);
    cx.fillStyle='#2d6fb7';cx.fillRect(-22,-18,36,36);cx.fillStyle='#ffd23f';cx.fillRect(-16,-4,16,8);
    cx.fillStyle='#9aa7b8';cx.fillRect(14,-3,Math.max(0,d-14),6);cx.translate(d,0);cx.fillStyle='#c4ceda';cx.fillRect(-17,-7,34,14)}
  cx.restore()}
function draw(){cx.drawImage(bg,0,0);
  if(mode==='edit'){cx.strokeStyle='rgba(255,255,255,.1)';cx.lineWidth=1;cx.beginPath();for(let x=0;x<=W;x+=G){cx.moveTo(x,0);cx.lineTo(x,H)}for(let y=0;y<=H;y+=G){cx.moveTo(0,y);cx.lineTo(W,y)}cx.stroke()}
  LV[lv].ter.forEach(([x,y,w,h])=>{cx.fillStyle='#3b4658';cx.fillRect(x,y,w,h);cx.fillStyle='#667790';cx.fillRect(x,y,w,5);cx.strokeStyle='rgba(0,0,0,.3)';cx.lineWidth=1;cx.strokeRect(x+.5,y+.5,w-1,h-1)});
  const [gx,gy]=LV[lv].g;drawCup(gx,gy,32,42,'#2f9bff');
  cx.fillStyle='#ffd23f';cx.font='13px "Russo One",Impact,sans-serif';cx.textAlign='center';const bob=Math.sin(performance.now()/300)*3;cx.fillText('GOAL \u25BC',gx,gy-54+bob);
  objs.forEach(drawObj);
  if(mode==='edit'&&tool&&mouse){const p={type:tool,x:snap(mouse.x),y:snap(mouse.y),a:ang};cx.globalAlpha=.55;drawObj({p,d:[Math.cos(ang),Math.sin(ang)]});cx.globalAlpha=1}
  const bx=ball.position.x,by=ball.position.y,rg=cx.createRadialGradient(bx-4,by-4,2,bx,by,R);rg.addColorStop(0,'#fff');rg.addColorStop(1,'#c9d2de');
  cx.fillStyle=rg;cx.beginPath();cx.arc(bx,by,R,0,7);cx.fill();cx.strokeStyle='rgba(0,0,0,.35)';cx.lineWidth=1.5;cx.stroke()}
function frame(ts){const dt=Math.min(50,ts-last);last=ts;
  if(mode==='run'){acc+=dt;while(acc>=1000/60&&mode==='run'){Engine.update(eng,1000/60);acc-=1000/60;check()}}
  draw();requestAnimationFrame(frame)}
load(0);requestAnimationFrame(t=>{last=t;frame(t)});
</script></body></html>
